    <!-- 笔杆：墨绿木杆 -->
    <path d="M9.4 23.1 L24.8 4.4 l4.1 3.4 -15.5 18.9 z" fill="#37452b" stroke="#1f2617" stroke-width="1.1" />
    <!-- 笔杆高光 -->
    <path d="M12.4 20.2 L25.9 5.9" stroke="#8e9b74" stroke-width=".9" opacity=".55" />
    <!-- 金属箍 -->
    <path d="M22.9 6.6 l3.8 3.1" stroke="#e9e0cb" stroke-width="1.5" opacity=".9" />
    <!-- 笔尖：赭石 -->
    <path d="M13.4 26.7 L9.4 23.1 L2.5 29.5 L8.2 28.5 z" fill="#8f4726" stroke="#552913" stroke-width="1.1" />
    <!-- 笔缝 -->

<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- 笔尖精确落在 (2, 2)：CSS 里的 hotspot 必须是 "2 2"。
       笔轴 45° 向右下，两条边关于轴对称（旧图用了四个不共线的点，所以看着是歪的）。
       纸色描边当光晕，压在深色夜底上也看得见。 -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- 光晕：同一条轮廓，粗纸色描边，先画 -->
    <path d="M2 2 L7.94 11.62 L21.38 25.05 L25.05 21.38 L11.62 7.94 Z"
          fill="none" stroke="#f7f1e1" stroke-width="3.4" />
    <!-- 笔杆 -->
    <path d="M2 2 L7.94 11.62 L21.38 25.05 L25.05 21.38 L11.62 7.94 Z"
          fill="#2f2b22" stroke="#14110c" stroke-width="0.8" />
    <!-- 笔杆上的握位环 -->
    <path d="M9.35 13.03 L13.03 9.35" stroke="#f7f1e1" stroke-width="1.1" opacity="0.55" />
    <!-- 笔尖：从尖端张开的对称楔形，赭石 -->
    <path d="M2 2 L7.94 11.62 L11.62 7.94 Z"
          fill="#8f4726" stroke="#4d2412" stroke-width="0.8" />
    <!-- 笔缝：沿轴一道细线 -->
    <path d="M3.4 3.4 L8.6 8.6" stroke="#f7f1e1" stroke-width="0.85" opacity="0.8" />
  </g>
</svg>
